services:
  - type: web
    name: realtime-analytics-dashboard
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STREAM_INTERVAL_MS
        value: 1500

